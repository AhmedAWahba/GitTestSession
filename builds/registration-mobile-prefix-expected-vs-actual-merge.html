<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Registration Mobile Prefix: Expected vs Actual APK</title>
  <style>
    body { margin: 0; background: #edf1f5; font-family: Arial, sans-serif; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <canvas id="comparison" width="1800" height="1180"></canvas>
  <script>
    const canvas = document.getElementById('comparison');
    const context = canvas.getContext('2d');
    const expected = new Image();
    const actual = new Image();

    function drawContain(image, panel) {
      const scale = Math.min(panel.width / image.width, panel.height / image.height);
      const width = image.width * scale;
      const height = image.height * scale;
      const x = panel.x + (panel.width - width) / 2;
      const y = panel.y + (panel.height - height) / 2;
      context.drawImage(image, x, y, width, height);
      return { x, y, width, height };
    }

    function drawPanel(title, image, panel) {
      context.fillStyle = '#ffffff';
      context.fillRect(panel.x - 12, 112, panel.width + 24, 960);
      context.fillStyle = '#111827';
      context.font = '700 34px Arial';
      context.fillText(title, panel.x, 108);
      return drawContain(image, panel);
    }

    function render() {
      context.fillStyle = '#edf1f5';
      context.fillRect(0, 0, canvas.width, canvas.height);
      context.fillStyle = '#111827';
      context.font = '700 34px Arial';
      context.fillText('Registration Comparison - Mobile Number Prefix', 60, 48);
      drawPanel('Expected QA Build Screenshot', expected, { x: 60, y: 150, width: 810, height: 900 });
      const actualFrame = drawPanel('Actual Android APK', actual, { x: 930, y: 150, width: 810, height: 900 });

      // One callout marks the current APK's separate country-code prefix.
      const target = {
        x: actualFrame.x + actualFrame.width * 0.03,
        y: actualFrame.y + actualFrame.height * 0.26,
        width: actualFrame.width * 0.94,
        height: actualFrame.height * 0.10
      };
      context.strokeStyle = '#dc2626';
      context.lineWidth = 8;
      context.strokeRect(target.x, target.y, target.width, target.height);
      context.fillStyle = '#dc2626';
      context.font = '700 26px Arial';
      context.fillText('1', target.x + 12, target.y + 31);
      context.fillText('1. Expected image shows 05XXXXXXXX in one field; actual APK separates +966 and masks the local number.', 60, 1125);
    }

    let loaded = 0;
    [expected, actual].forEach((image) => {
      image.onload = () => { loaded += 1; if (loaded === 2) render(); };
    });
    expected.src = 'qa-auth-flow/qa-auth-flow/18-signup-3-mobile.png';
    actual.src = 'apex-ui-android-mobile-verification.png';
  </script>
</body>
</html>
